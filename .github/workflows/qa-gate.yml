name: BuildingFlow QA quality gate
# Manual only: planned or nightly runs stay off until the user explicitly enables them (qa-center/MASTER_PROMPT.md).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qa-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/buildingflow-web/package-lock.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Create isolated CI configuration
        run: bash scripts/init-local.sh
      - name: Guarded tests and quality gates
        run: bash scripts/ci.sh --install
      - name: Evidence report and QA gate (no GitHub writes)
        run: |
          python3 scripts/qa_report.py artifacts/ci --out artifacts/ci/qa-report
          cat artifacts/ci/qa-report/report.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/qa_github.py gate artifacts/ci/qa-report/report.json
