<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildingFlow · Mobil Faz 02</title>
<style>
:root{--ink:#102342;--muted:#52647a;--blue:#0866e8;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,select{min-height:48px;cursor:pointer}button{border:1px solid #c9d4e3;background:white;color:var(--ink);border-radius:12px;padding:10px 14px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:3px}button:disabled{opacity:.6;cursor:default}.primary{background:var(--blue);color:white;border-color:var(--blue)}.tools{max-width:960px;margin:24px auto;padding:0 16px;display:flex;gap:16px;flex-wrap:wrap;align-items:end}.tools p{flex-basis:100%;margin:0;color:var(--muted);font-size:14px}label{display:grid;gap:8px}select,input,textarea{width:100%;border:1px solid #c9d4e3;border-radius:12px;padding:12px;background:white;color:var(--ink)}.phone{max-width:430px;margin:24px auto;background:var(--bg);border:1px solid #c9d4e3;border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #10234214}header{padding:24px 20px 16px;background:white;border-bottom:1px solid #e5eaf2}.brand{font-weight:800;font-size:20px;letter-spacing:-.5px}.brand span{color:var(--blue)}.eyebrow{color:var(--muted);font-size:14px;margin:8px 0}header select{background:var(--bg)}main{padding:20px;min-height:430px}h1{font-size:24px;line-height:1.25;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:0}p{margin:8px 0}.muted{color:var(--muted);font-size:14px}.card{background:white;border:1px solid #e5eaf2;border-radius:20px;padding:20px;margin:16px 0}.money{font-size:32px;font-weight:750;letter-spacing:-1px;font-variant-numeric:tabular-nums}.hero{background:var(--ink);color:white}.hero .muted{color:#c6d5e8}.hero button{width:100%;margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e5eaf2;padding:14px 0;overflow-wrap:anywhere}.row:last-child{border:0}.row button{flex-shrink:0}.status{padding:12px 16px;border-radius:12px;background:#fff4d6;color:#795100;margin-bottom:16px;font-size:14px}.error{background:#fff0ef;color:#a12622}.success{background:#e7f5ed;color:#146344}.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}.quick button{text-align:left;padding:16px}.quick small{display:block;color:var(--muted)}nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:white;border-top:1px solid #e5eaf2;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}nav button{border:0;border-radius:10px;padding:8px 2px;font-size:11px;min-width:0;overflow-wrap:anywhere}nav button span{display:block;font-size:20px}nav button[aria-current=page]{background:#edf4ff;color:var(--blue);font-weight:700}form{display:grid;gap:16px}.actions{display:flex;gap:12px;flex-wrap:wrap}.actions button{flex:1}dialog{border:0;border-radius:20px;padding:24px;width:calc(100% - 32px);max-width:400px;color:var(--ink)}dialog::backdrop{background:#10234280}.skeleton{height:72px;background:#e5eaf2;border-radius:12px;margin:16px 0}#notice:empty{display:none}@media(max-width:480px){.phone{margin:16px 0;border-radius:0;border-left:0;border-right:0;width:100%}.tools{margin:16px auto}main{padding:16px}header{padding:20px 16px}.money{font-size:30px}}
</style></head>
<body>
<section class="tools" aria-label="Prototip senaryoları"><label>Rol<select id="role"><option>Kiracı</option><option>Ev sahibi</option><option>Yönetici</option></select></label><label>Ekran durumu<select id="state"><option value="normal">Güncel</option><option value="offline">Çevrimdışı</option><option value="loading">Yükleniyor</option><option value="empty">Boş</option><option value="error">Hata</option><option value="pending">Gönderim bekliyor</option><option value="conflict">Çakışma</option><option value="session">Oturum sonu</option></select></label><p>Faz 02 tasarım prototipi · Tüm kayıtlar örnektir. Taslaklar yalnız bu sayfa açıkken tutulur.</p></section>
<article class="phone" aria-label="BuildingFlow mobil önizleme"><header><div class="brand">Building<span>Flow</span></div><p class="eyebrow" id="context"></p><label>Mülk<select id="property"><option>Örnek Park · A Blok · Daire 12</option><option>Örnek Bahçe · B Blok · Daire 4</option></select></label></header><main id="screen"></main><nav aria-label="Ana gezinme"></nav></article>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">Taslağı sil?</h2><p>Bu sayfada tuttuğun örnek talep taslağı kaldırılacak.</p><div class="actions"><button id="cancel">Vazgeç</button><button id="delete">Taslağı sil</button></div></dialog>
<script>
const role=document.getElementById('role'),state=document.getElementById('state'),property=document.getElementById('property'),screen=document.getElementById('screen'),nav=document.querySelector('nav'),dialog=document.getElementById('confirm');
const tabs=['Ana sayfa','Finans','Duyurular','Talepler','Profil'],symbols=['⌂','₺','≡','＋','○'];let tab=0,detail=false,draft=null,notice='',opener=null;
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(i){tab=i;detail=false;notice='';render();screen.querySelector('h1')?.focus()}
function render(){document.getElementById('context').textContent=role.value+' çalışma alanı';nav.innerHTML=tabs.map((t,i)=>`<button type="button" data-tab="${i}" ${tab===i?'aria-current="page"':''}><span aria-hidden="true">${symbols[i]}</span>${t}</button>`).join('');
const messages={offline:'Çevrimdışısın · Son kayıt: 13 Ekim 2026, 09.30. Bakiye güncel olmayabilir.',pending:'Örnek senaryo: 1 yerel kayıt gönderim bekliyor. Sunucuya gönderilmedi.',conflict:'Örnek senaryo: Kayıt değişmiş. Güncel kaydı incele; taslağın korunur.'};
let html=messages[state.value]?`<div class="status" role="status">${messages[state.value]}</div>`:'';
html+=`<div id="notice" class="status success" role="status">${escapeText(notice)}</div>`;
if(state.value==='loading'){screen.innerHTML=html+'<h1>Yükleniyor</h1><p role="status">Seçili mülk bilgileri hazırlanıyor.</p><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div>';return}
if(state.value==='session'){screen.innerHTML='<h1>Oturumun sona erdi</h1><p>Verilerini görmek için yeniden giriş yap.</p><button data-action="login" class="primary">Giriş akışını incele</button>';return}
if(state.value==='error'){screen.innerHTML=html+'<h1>Bilgiler yüklenemedi</h1><p class="status error" role="alert">Bağlantıyı kontrol edip tekrar deneyebilirsin.</p><button data-action="retry" class="primary">Tekrar dene</button>';return}
if(state.value==='empty'){screen.innerHTML=html+`<h1>${tabs[tab]}</h1><div class="card"><h2>Henüz kayıt yok</h2><p>Bu mülk için ${tabs[tab].toLocaleLowerCase('tr')} bilgisi bulunmuyor.</p>${tab===3?'<button data-action="new" class="primary">Talep oluştur</button>':''}</div>`;return}
if(tab===0){const manager=role.value==='Yönetici',owner=role.value==='Ev sahibi';html+=`<h1>${manager?'Binana genel bakış':owner?'Mülküne genel bakış':'Evine genel bakış'}</h1><p class="muted">13 Ekim 2026 · Örnek veriler</p><section class="card hero"><p>${manager?'Bina genelinde açık borç':owner?'Seçili dairenin açık borcu':'Bu dönem ödenecek aidat'}</p><div class="money">${manager?'48.600,00':'2.450,00'} ₺</div><p class="muted">${manager?'24 daire · Ekim dönemi':'Ekim 2026 · Son gün 20 Ekim'}</p><button data-action="finance">Borç detayını incele</button></section><div class="quick"><button data-action="requests">${manager?'Talepleri incele':'Talep oluştur'}<small>Bakım ve ortak alan</small></button><button data-action="announcements">Duyurular<small>Bina haberleri</small></button></div><section class="card"><h2>${owner?'Daire özeti':'Son duyuru'}</h2><p>${owner?escapeText(property.value):'Asansör bakım çalışması'}</p><p class="muted">${owner?'İlişki ve sözleşme bilgileri yetkili API verisiyle gösterilecek.':'15 Ekim · 10.00–12.00 · Örnek duyuru'}</p></section>`}
if(tab===1){html+=`<h1>${detail?'Ekim dönemi':'Finans'}</h1><p class="muted">${escapeText(property.value)} · Son kayıt 09.30</p><section class="card"><p>${role.value==='Yönetici'?'Bina genelinde açık borç':'Daire açık borcu'}</p><div class="money">${role.value==='Yönetici'?'48.600,00':'2.450,00'} ₺</div><p class="muted">Örnek hesap özeti</p>${detail?'<div class="row"><span>Vade</span><strong>20 Ekim 2026</strong></div><p>Online ödeme sağlayıcısı henüz tanımlanmadı.</p><button data-action="back">Finansa dön</button>':'<button data-action="detail">Ekim dönemi detayı</button>'}</section><h2>İşlem geçmişi</h2><div class="card"><div class="row"><span>Ekim tahakkuku<br><small class="muted">1 Ekim 2026</small></span><strong>Açık</strong></div><div class="row"><span>Eylül dönemi<br><small class="muted">Örnek hareket</small></span><strong>Kapalı</strong></div></div>`}
if(tab===2){html+='<h1>Duyurular</h1><section class="card"><h2>Asansör bakım çalışması</h2><p class="muted">13 Ekim 2026 · Örnek duyuru</p><p>15 Ekim günü 10.00–12.00 arasında asansör bakım nedeniyle kullanılamayacak.</p><p>Okundu · Bu prototipte dosya eki bulunmuyor.</p></section>'}
if(tab===3){html+=`<h1>Talepler</h1><p class="muted">${escapeText(property.value)}</p>${draft?`<div class="card"><h2>Yerel taslak</h2><p>${escapeText(draft.category)}</p><p>${escapeText(draft.text)}</p><p class="muted">Bu sayfanın belleğinde · Sunucuya gönderilmedi</p><button data-action="remove">Taslağı sil</button></div>`:''}<section class="card"><h2>Yeni talep</h2><form id="request"><label>Kategori (zorunlu)<select name="category" required><option value="">Kategori seç</option><option>Ortak alan</option><option>Su tesisatı</option><option>Elektrik</option></select></label><label>Açıklama (zorunlu)<textarea name="description" rows="4" maxlength="1000" required placeholder="Sorunu kısaca anlat"></textarea></label><p class="muted">Fotoğraf isteğe bağlıdır. Kamera/galeri ve yükleme akışı Faz 07/12'de uygulanacak.</p><button class="primary" type="submit">Yerel taslak olarak kaydet</button></form></section>`}
if(tab===4){html+=`<h1>Profil</h1><section class="card"><h2>Örnek kullanıcı</h2><p>${role.value} · ${escapeText(property.value)}</p><p class="muted">Fotoğraf ekle, değiştir ve kaldır akışları Faz 07 kapsamındadır.</p></section><section class="card"><h2>Gizlilik ve tercihler</h2><p>Fotoğraf ve push izinleri ilgili özelliği kullanırken istenecek. İzin reddinde temel kullanım devam edecek.</p><p class="muted">Saklama ve hukuki metin kararları bekleniyor.</p></section>`}
screen.innerHTML=html;screen.querySelector('h1')?.setAttribute('tabindex','-1');
}
nav.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(Number(b.dataset.tab))});
screen.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;switch(b.dataset.action){case'finance':go(1);break;case'requests':go(3);break;case'announcements':go(2);break;case'detail':detail=true;render();break;case'back':detail=false;render();break;case'retry':state.value='normal';render();break;case'new':state.value='normal';go(3);break;case'login':notice='Gerçek giriş Faz 04 kapsamındadır. Bu önizleme kimlik doğrulamaz.';screen.innerHTML='<h1>Giriş</h1><p>'+notice+'</p>';break;case'remove':opener=b;dialog.showModal();document.getElementById('cancel').focus();break}});
screen.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.target);draft={category:data.get('category'),text:data.get('description').trim()};if(!draft.text){draft=null;const field=e.target.elements.description;field.setCustomValidity('Açıklama boş olamaz.');field.reportValidity();field.addEventListener('input',()=>field.setCustomValidity(''),{once:true});return}notice='Taslak bu sayfada kaydedildi. Yenilemede silinir; sunucuya gönderilmedi.';render()});
document.getElementById('cancel').onclick=()=>{dialog.close();opener?.focus()};document.getElementById('delete').onclick=()=>{dialog.close();draft=null;notice='Örnek taslak silindi.';render();screen.querySelector('h1')?.focus()};
role.onchange=property.onchange=()=>{draft=null;notice='';detail=false;render()};state.onchange=()=>{notice='';render()};render();
</script></body></html>
