global:
  scrape_interval: 5s
scrape_configs:
  - job_name: buildingflow
    static_configs:
      - targets: ['otel-collector:8889']
  - job_name: dependency-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://buildingflow-api:8080/health
          - http://host.docker.internal:5005/health
          - http://keycloak-26.7.5:9000/health/ready
          - http://minio:9000/minio/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: tcp-health
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['postgres-18.6:5432', 'redis:6379', 'rabbitmq:5672']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
