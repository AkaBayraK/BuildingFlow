buildingflowContactChangedSubject=BuildingFlow e-posta adresiniz değiştirildi
buildingflowContactChangedBody=Hesabınızın e-posta adresi yeni adres doğrulandıktan sonra değiştirildi. Bu işlemi siz yapmadıysanız yetkili destek ekibine başvurun. Bu bildirim doğrulama kodu veya giriş bağlantısı içermez.
