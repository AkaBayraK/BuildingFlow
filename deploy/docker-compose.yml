name: buildingflow
services:
  buildingflow-web:
    build:
      context: ..
      dockerfile: frontend/buildingflow-web/Dockerfile
      args:
        BUILDINGFLOW_SESSION_CONTEXTS_ENABLED: ${BUILDINGFLOW_SESSION_CONTEXTS_ENABLED:-false}
        BUILDINGFLOW_PERSON_CENTER_ENABLED: ${BUILDINGFLOW_PERSON_CENTER_ENABLED:-false}
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-5005}
        NEXT_PUBLIC_OIDC_AUTHORITY: http://localhost:${KEYCLOAK_PORT:-8080}/realms/buildingflow
        NEXT_PUBLIC_OIDC_CLIENT_ID: buildingflow-web
    environment:
      BUILDINGFLOW_SESSION_CONTEXTS_ENABLED: ${BUILDINGFLOW_SESSION_CONTEXTS_ENABLED:-false}
      BUILDINGFLOW_PERSON_CENTER_ENABLED: ${BUILDINGFLOW_PERSON_CENTER_ENABLED:-false}
      API_INTERNAL_URL: http://buildingflow-api:8080
    ports: ["127.0.0.1:${WEB_PORT:-3003}:3000"]
    depends_on:
      buildingflow-api: {condition: service_started}
  buildingflow-api:
    image: buildingflow-api:local
    build:
      context: ..
      dockerfile: backend/src/BuildingFlow.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Database: Host=${POSTGRES_HOST:-postgres-18.6};Port=5432;Search Path=${POSTGRES_SCHEMA:-buildingflow},extensions;Database=${POSTGRES_DB:-projects};Username=${POSTGRES_USER:-buildingflow};Password=${POSTGRES_PASSWORD:?Run scripts/init-local.sh}
      Authentication__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/buildingflow
      Authentication__Audience: buildingflow-api
      Authentication__MetadataAddress: http://${KEYCLOAK_INTERNAL_HOST:-keycloak-26.7.5}:8080/realms/buildingflow/.well-known/openid-configuration
      Cors__Origins__0: http://localhost:${WEB_PORT:-3003}
      Redis__ConnectionString: redis:6379
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-buildingflow}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Run scripts/init-local.sh}
      Telemetry__Enabled: "true"
      Telemetry__Endpoint: http://otel-collector:4318
      ObjectStorage__Endpoint: http://seaweedfs-s3:8333
      ObjectStorage__AccessKey: ${OBJECT_STORAGE_ACCESS_KEY:?Run scripts/init-local.sh}
      ObjectStorage__SecretKey: ${OBJECT_STORAGE_SECRET_KEY:?Run scripts/init-local.sh}
      PersonCode__HmacKey: ${PERSON_CODE_HMAC_KEY:?Run scripts/init-local.sh}
      Website__PreviewHmacKey: ${WEBSITE_PREVIEW_HMAC_KEY:-}
      Website__InquiryHmacKey: ${WEBSITE_INQUIRY_HMAC_KEY:-}
      Website__PlatformDomain: ${WEBSITE_PLATFORM_DOMAIN:-}
      KeycloakAdmin__BaseUrl: http://${KEYCLOAK_INTERNAL_HOST:-keycloak-26.7.5}:8080
      KeycloakAdmin__ClientSecret: ${BUILDINGFLOW_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      PersonRefactor__Enabled: ${PersonRefactor__Enabled:-false}
      PersonRefactor__AssignmentsEnabled: ${PersonRefactor__AssignmentsEnabled:-false}
      PersonRefactor__TransitionEnabled: ${PersonRefactor__TransitionEnabled:-false}
      PersonRefactor__MobileSyncEnabled: ${PersonRefactor__MobileSyncEnabled:-false}
      PersonRefactor__MobileAuthorizationEnabled: ${PersonRefactor__MobileAuthorizationEnabled:-false}
      PersonRefactor__SessionContextsEnabled: ${PersonRefactor__SessionContextsEnabled:-false}
      PersonRefactor__UnitRelationWritesEnabled: ${PersonRefactor__UnitRelationWritesEnabled:-false}
    ports: ["127.0.0.1:${API_PORT:-5005}:8080"]
    depends_on:
      buildingflow-migrations: {condition: service_completed_successfully}
    networks: [default, shared-postgres, storage]
  buildingflow-migrations:
    image: buildingflow-api:local
    build:
      context: ..
      dockerfile: backend/src/BuildingFlow.Api/Dockerfile
    command: ["--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PersonCode__HmacKey: ${PERSON_CODE_HMAC_KEY:?Run scripts/init-local.sh}
      ConnectionStrings__Database: Host=${POSTGRES_HOST:-postgres-18.6};Port=5432;Search Path=${POSTGRES_SCHEMA:-buildingflow},extensions;Database=${POSTGRES_DB:-projects};Username=${POSTGRES_USER:-buildingflow};Password=${POSTGRES_PASSWORD:?Run scripts/init-local.sh}
      Authentication__Authority: http://localhost:${KEYCLOAK_PORT:-8080}/realms/buildingflow
      Authentication__Audience: buildingflow-api
    networks: [default, shared-postgres]
  buildingflow-worker:
    build:
      context: ..
      dockerfile: backend/src/BuildingFlow.Worker/Dockerfile
    environment:
      ConnectionStrings__Database: Host=${POSTGRES_HOST:-postgres-18.6};Port=5432;Search Path=${POSTGRES_SCHEMA:-buildingflow},extensions;Database=${POSTGRES_DB:-projects};Username=${POSTGRES_USER:-buildingflow};Password=${POSTGRES_PASSWORD:?Run scripts/init-local.sh}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: ${RABBITMQ_USER:-buildingflow}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:?Run scripts/init-local.sh}
      PersonCode__HmacKey: ${PERSON_CODE_HMAC_KEY:?Run scripts/init-local.sh}
      # Local delivery is captured by Mailpit; production SMTP host/credentials come from external secrets.
      Telemetry__Enabled: "true"
      Telemetry__Endpoint: http://otel-collector:4318
      Smtp__Enabled: "true"
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__UseStartTls: "false"
      Smtp__AllowInsecureLocal: "true"
      Smtp__From: no-reply@buildingflow.local
    depends_on:
      rabbitmq: {condition: service_healthy}
      mailpit: {condition: service_started}
      buildingflow-migrations: {condition: service_completed_successfully}
    networks: [default, shared-postgres]
  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6389}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-buildingflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Run scripts/init-local.sh}
    ports: ["127.0.0.1:${RABBITMQ_PORT:-5672}:5672", "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["mini", "-dir=/data", "-ip=seaweedfs", "-s3=false", "-admin.ui=false", "-webdav=false", "-s3.iam.readOnly=true", "-s3.allowDeleteBucketNotEmpty=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?Run scripts/init-local.sh}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Run scripts/init-local.sh}
      S3_BUCKET: buildingflow-documents
    volumes: ["seaweedfs-data:/data"]
    networks: [storage-data]
  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["s3", "-filer=seaweedfs:8888", "-port=8333", "-config=/run/secrets/s3.json", "-iam.readOnly=true", "-allowDeleteBucketNotEmpty=false"]
    volumes: ["./seaweedfs/private-s3.json:/run/secrets/s3.json:ro"]
    ports: ["127.0.0.1:${OBJECT_STORAGE_PORT:-9040}:8333"]
    depends_on:
      seaweedfs: {condition: service_started}
    networks: [storage-data, storage]
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]
    networks: [default, shared-postgres]
  grafana:
    image: grafana/grafana:12.4.11
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-buildingflow-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/init-local.sh}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ["127.0.0.1:${GRAFANA_PORT:-3002}:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yml"]
    ports: ["127.0.0.1:${OTLP_PORT:-14318}:4318"]
    volumes: ["./observability/collector.yml:/etc/otelcol/config.yml:ro"]
    depends_on:
      loki: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector: {condition: service_started}
      blackbox: {condition: service_started}
  blackbox:
    image: prom/blackbox-exporter:v0.28.0
    command: ["--config.file=/etc/blackbox.yml"]
    volumes: ["./observability/blackbox.yml:/etc/blackbox.yml:ro"]
    networks: [default, shared-postgres, storage]
  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yml"]
    ports: ["127.0.0.1:${LOKI_PORT:-13100}:3100"]
    volumes:
      - ./observability/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
networks:
  storage-data:
    internal: true
  storage:
    name: buildingflow-storage-s3
  default:
    name: buildingflow-network
  shared-postgres:
    external: true
    name: ${SHARED_POSTGRES_NETWORK:-shared-postgres-net}
volumes:
  redis-data:
  rabbitmq-data:
  seaweedfs-data:
  grafana-data:
  prometheus-data:
  loki-data:
